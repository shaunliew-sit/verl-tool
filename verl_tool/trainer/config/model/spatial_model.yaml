# Format checks enforced on CI:
# 1. Comments must appear above each field.
# 2. There must be a blank line between each field.
# 3. Inline comments (after a field on the same line) are not allowed.
# 4. Indentation level is respected for nested fields.

# Spatial Linking Model Configuration for GRPO Training
# Extends the base HF model config with spatial linking options

_target_: verl.workers.config.HFModelConfig

# path to the huggingface model (e.g., Qwen/Qwen3-VL-8B-Instruct)
path: ~/models/qwen3-vl-8b-instruct

# config to the huggingface config. In case it is not the same as path
hf_config_path: null

# path to the huggingface tokenizer. In case it is not the same as path
tokenizer_path: null

# whether to use shared memory for model loading
use_shm: False

# whether to trust remote code.
trust_remote_code: True

# custom chat template for the model
custom_chat_template: null

# whether to use external libs for the model
external_lib: null

# override hf config
override_config: {}

# whether to enable gradient checkpointing. Only valid when we use hf model definition
enable_gradient_checkpointing: True

# whether to enable activation offload. Only valid when we use hf model definition
enable_activation_offload: False

# whether to use remove padding. Only valid when we use hf model definition
use_remove_padding: False

# Set to positive value to enable LoRA (e.g., 64 for spatial linking)
lora_rank: 64

# LoRA scaling factor
lora_alpha: 128

# Target modules for LoRA adaptation
target_modules: all-linear

# Exclude modules from LoRA adaptation
exclude_modules: null

# Path to pre-trained LoRA adapter to load for continued training
lora_adapter_path: null

# whether to use liger. Only valid when we use hf model definition
use_liger: False

# whether to use fused kernels.
use_fused_kernels: False

# fused kernel options.
fused_kernel_options:
  # the implementation backend for fused kernels.
  impl_backend: torch

# ============================================================================
# Spatial Linking Configuration (New fields for spatial linking support)
# ============================================================================

# Whether to use SpatialLinkingInteractionModel instead of standard Qwen3-VL
use_spatial_linking: False

# Path to pre-trained spatial linking weights checkpoint
# If provided, the spatial linking module weights will be loaded from this path
# Format: path to .pt or .safetensors file containing spatial_linking state_dict
spatial_linking_checkpoint: null

# Whether to freeze the spatial linking module during RL training
# If True, only LoRA parameters will be trained
# If False, both LoRA and spatial linking parameters will be trained
freeze_spatial_linking: False

# Whether to freeze the vision tower during training
# Recommended: True to save memory and maintain vision representations
freeze_vision_tower: True
